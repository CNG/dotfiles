---
- name: Install rcm
  aur:
    name: rcm
  when: dotfiles is defined
  become: yes
  become_user: aur_builder

# This would put the dotfiles in place for rcup to do its work
# But till I have the repo set up, I need to manually put the
# dotfiles in ~/dotfiles
- name: Clone user dotfiles
  git:
    repo: "{{ dotfiles.git_url }}"
    dest: "/home/{{ user.name }}/{{ dotfiles.path }}"
    accept_hostkey: yes
    update: no
  when: dotfiles.url is defined
  become: yes
  become_user: "{{ user.name }}"

- name: Install user dotfiles
  when: dotfiles.path is defined
  shell: "rcup -d /home/{{ user.name }}/{{ dotfiles.path }}/files -fv | grep -v '^identical'"
  environment:
    COPY_ALWAYS: "{{ dotfiles.files_to_copy_not_link | default('') }}"
  become: yes
  become_user: "{{ user.name }}"
  register: result
  changed_when: result.rc == 0  # grep got results
  failed_when: result.rc > 1  # grep return 1 is not an error
- name: "Made the following dotfiles changes:"
  debug:
    msg: "{{ result.stdout_lines }}"
  when: result.rc == 0
  changed_when: result.rc == 0  # grep got results

- name: Set Github author name
  git_config:
    name: user.name
    scope: global
    value: "{{ user.fullname }}"

- name: Set Github author email
  git_config:
    name: user.email
    scope: global
    value: "{{ user.email }}"

- name: Mount volumes
  when: volumes is defined
  block:
  - name: Get device UUIDs
    command: "ls /dev/disk/by-uuid"
    register: ls_result
    changed_when: False
  - set_fact:
      uuids: "{{ ls_result.stdout_lines }}"
  - debug:
      var: uuids
      verbosity: 2
  - name: Mount volumes
    when: item.uuid in uuids
    block:
    - debug:
        msg: "Looking for UUID {{ item.uuid }} in {{ uuids }}"
        verbosity: 2
      with_items: "{{ volumes }}"
    - name: Mount volumes
      mount:
        path: "{{ item.path }}"
        src: "UUID={{ item.uuid }}"
        fstype: auto
        opts: "{{ item.opts }}"
        state: mounted
      with_items: "{{ volumes }}"

- name: Link Downloads to Sorting
  block:

  - name: Check that the Sorting destination exists
    stat:
      path: "/home/{{ user.name }}/GDrive/Main/Sorting"
    register: sorting_directory

  - name: Require the Sorting destination to be a directory
    fail:
      msg: "/home/{{ user.name }}/GDrive/Main/Sorting must exist before Downloads can be linked to it."
    when: not (sorting_directory.stat.isdir | default(false))

  - name: Check the existing Downloads path
    stat:
      path: "/home/{{ user.name }}/Downloads"
      follow: no
    register: downloads_path

  - name: Refuse to replace an unsupported Downloads path
    fail:
      msg: >-
        /home/{{ user.name }}/Downloads exists but is not a directory or the
        requested symlink. Resolve it manually before provisioning.
    when:
      - downloads_path.stat.exists | default(false)
      - not (downloads_path.stat.isdir | default(false))
      - not ((downloads_path.stat.islnk | default(false)) and
            (downloads_path.stat.lnk_source | default('') == '/home/' ~ user.name ~ '/GDrive/Main/Sorting'))

  - name: List existing Downloads contents
    find:
      paths: "/home/{{ user.name }}/Downloads"
      hidden: yes
      recurse: no
      file_type: any
    register: downloads_contents
    when: downloads_path.stat.isdir | default(false)

  - name: Check for name conflicts in Sorting
    stat:
      path: "/home/{{ user.name }}/GDrive/Main/Sorting/{{ item.path | basename }}"
    loop: "{{ downloads_contents.files | default([]) }}"
    register: sorting_conflicts

  - name: Refuse to overwrite existing Sorting contents
    fail:
      msg: >-
        Cannot move Downloads contents because
        {{ item.item.path | basename }} already exists in
        /home/{{ user.name }}/GDrive/Main/Sorting. Resolve the conflict and rerun provisioning.
    loop: "{{ sorting_conflicts.results | default([]) }}"
    when: item.stat.exists | default(false)

  - name: Move existing Downloads contents into Sorting
    command:
      argv:
        - mv
        - --
        - "{{ item.path }}"
        - "/home/{{ user.name }}/GDrive/Main/Sorting/"
    loop: "{{ downloads_contents.files | default([]) }}"

  - name: Remove the now-empty Downloads directory
    file:
      path: "/home/{{ user.name }}/Downloads"
      state: absent
    when: downloads_path.stat.isdir | default(false)

  - name: Link Downloads to Sorting
    file:
      path: "/home/{{ user.name }}/Downloads"
      src: "/home/{{ user.name }}/GDrive/Main/Sorting"
      state: link
      owner: "{{ user.name }}"
      group: "{{ user.group }}"

- name: Link private files
  file:
    path: "/home/{{ user.name }}/.{{ item }}"
    src: "/home/{{ user.name }}/{{ dotfiles.path }}/private/{{ item }}"
    state: link
    force: yes
  with_items:
    - zshrc.local
    - zshenv.local
    - gitconfig.local
    - ssh

