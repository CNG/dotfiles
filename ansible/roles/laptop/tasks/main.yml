- name: Ensure logind dropin dir exists
  file:
    path: "/etc/systemd/logind.conf.d"
    state: directory

- name: Copy logind configuration file
  copy:
    src: logind.conf
    dest: /etc/systemd/logind.conf.d/no-suspend-on-lid.conf


