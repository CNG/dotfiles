---
- name: Install DigiKam and dependencies
  when: "'digikam' in flags"
  block:
    - name: Install DigiKam and dependencies
      aur:
        name: "{{ item }}"
      become: yes
      become_user: aur_builder
      with_items:
        - digikam
        - qt5-imageformats
        - hugin

- name: Remove DigiKam and dependencies
  when: "'digikam' not in flags"
  become: yes
  block:
    - name: Remove DigiKam and dependencies
      pacman:
        name:
          - digikam
          - qt5-imageformats
          - hugin
        state: absent

