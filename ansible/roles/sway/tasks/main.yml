---
- name: Install Sway tiling window manager
  aur:
    name: "{{ packages.sway }}"
  become: yes
  become_user: aur_builder

- name: Ensure user config directory exists
  file:
    path: "/home/{{ user.name }}/.config"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: 0755

- name: Check the user's default web browser
  command: xdg-settings get default-web-browser
  register: default_web_browser
  changed_when: false
  become: yes
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"

- name: Set Firefox as the user's default web browser
  command: xdg-settings set default-web-browser firefox.desktop
  when: default_web_browser.stdout != "firefox.desktop"
  become: yes
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"

- name: Check the user's default web link handlers
  command: "xdg-mime query default {{ item }}"
  loop:
    - text/html
    - application/xhtml+xml
    - x-scheme-handler/http
    - x-scheme-handler/https
  register: default_web_link_handlers
  changed_when: false
  become: yes
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"

- name: Set Firefox as the user's default web link handler
  command:
    argv:
      - xdg-mime
      - default
      - firefox.desktop
      - "{{ item.item }}"
  loop: "{{ default_web_link_handlers.results }}"
  when: item.stdout != "firefox.desktop"
  become: yes
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"

- name: Set VLC as the user default video player
  ini_file:
    dest: "/home/{{ user.name }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: vlc.desktop
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: 0644
  with_items:
    - video/3gpp
    - video/3gpp2
    - video/mp2t
    - video/mp4
    - video/mpeg
    - video/ogg
    - video/quicktime
    - video/webm
    - video/x-flv
    - video/x-m4v
    - video/x-matroska
    - video/x-ms-asf
    - video/x-msvideo
    - video/x-ms-wmv

- name: Set Gwenview as the user default image viewer
  ini_file:
    dest: "/home/{{ user.name }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: org.kde.gwenview.desktop
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: 0644
  with_items:
    - image/avif
    - image/bmp
    - image/gif
    - image/heic
    - image/heif
    - image/jpeg
    - image/png
    - image/svg+xml
    - image/tiff
    - image/vnd.microsoft.icon
    - image/webp

# Used by Sway's $topright rules to position floating windows at the screen edge.
- name: Push sway_move script
  copy:
    src: sway_move.sh
    dest: /usr/local/bin/sway_move
    mode: 0755
