---
- name: Install Sway tiling window manager
  aur:
    name: "{{ packages.sway }}"
  become: yes
  become_user: aur_builder

- name: Ensure user config directory exists
  file:
    path: "/home/{{ user.name }}/.config"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: 0755

# Following block supposedly replaces these shell commands:
# xdg-settings set default-web-browser firefox.desktop
# xdg-mime default firefox.desktop x-scheme-handler/http
# xdg-mime default firefox.desktop x-scheme-handler/https
# xdg-mime default firefox.desktop text/html
- name: Set Firefox as the user default browser
  ini_file:
    dest: "/home/{{ user.name }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: firefox.desktop
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: 0644
  with_items:
    - text/html
    - application/xhtml+xml
    - x-scheme-handler/http
    - x-scheme-handler/https

- name: Set VLC as the user default video player
  ini_file:
    dest: "/home/{{ user.name }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: vlc.desktop
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: 0644
  with_items:
    - video/3gpp
    - video/3gpp2
    - video/mp2t
    - video/mp4
    - video/mpeg
    - video/ogg
    - video/quicktime
    - video/webm
    - video/x-flv
    - video/x-m4v
    - video/x-matroska
    - video/x-ms-asf
    - video/x-msvideo
    - video/x-ms-wmv

- name: Push sway_move script
  copy:
    src: sway_move.sh
    dest: /usr/local/bin/sway_move
    mode: 0755
