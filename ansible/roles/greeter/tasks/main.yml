---

# Sway is a Wayland compositor, greetd is a minimal Wayland login manager daemon,
# and ReGreet is a GTK-based login screen graphical user interface. Together,
# greetd launches Sway to render the ReGreet login interface before you sign into
# your main desktop session.

- name: Install GreetD and ReGreet
  pacman:
    name:
      - greetd-regreet
    state: present
  become: yes

- name: Create background dir
  file:
    path: /usr/share/backgrounds
    state: directory

- name: Push greeter background for 4K
  copy:
    src: taipei_cyberpunk_3840x2160.png
    dest: /usr/share/backgrounds/greeter_3840.jpg
    mode: 0666

- name: Push greeter background for laptop
  copy:
    src: taipei_cyberpunk_2880x1800.png
    dest: /usr/share/backgrounds/greeter_2880.jpg
    mode: 0666

- name: Create Sway config file
  copy:
    src: sway-config
    dest: /etc/greetd/sway-config
    mode: 0644

- name: Create GreetD config file
  copy:
    src: greetd-config.toml
    dest: /etc/greetd/config.toml
    mode: 0644

- name: Create ReGreet config file
  copy:
    src: regreet-config.toml
    dest: /etc/greetd/regreet.toml
    mode: 0644

- name: Enable GreetD to start upon boot
  service:
    name: greetd
    enabled: yes
