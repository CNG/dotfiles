---
# TODO This didn't fix my sound actually
- name: Enable Sway unsupported GPU support
  lineinfile:
    path: /etc/environment
    line: SWAY_UNSUPPORTED_GPU=true
    create: yes

- name: Install Sound Open Firmware
  aur:
    name:
      - sof-firmware
      - sof-bin
  become: yes
  become_user: aur_builder

- name: Install Intel graphics
  aur:
    name:
      - mesa  # OpenGL
      - vulkan-intel  # Vulkan
      - intel-media-driver  # VA-API
      # Following not strictly needed, just troubleshooting utils
      - intel-gpu-tools
      - vulkan-tools
      - libva-utils
      - vdpauinfo
      - mesa-utils
  become: yes
  become_user: aur_builder

- name: Install NVIDIA graphics
  aur:
    name:
      - nvidia-open
      - nvidia-utils
      - nvidia-prime
      # Google claims this is redundant under modern proprietary NVIDIA driver.
      # - nvidia-prime-rtd3pm  # Explained at https://wiki.archlinux.org/title/PRIME#NVIDIA
      # Installed by ollama-cuda
      - cuda
      - opencl-nvidia
      # Following not strictly needed, just troubleshooting utils
      - nvtop
  become: yes
  become_user: aur_builder


